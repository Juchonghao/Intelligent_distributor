<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能视频分发代理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
    document.documentElement.classList.add('dark')
  </script>
</head>
<body class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen font-sans">

<div class="w-full max-w-4xl bg-gray-800 shadow-2xl rounded-2xl p-8 space-y-6">

  <div class="text-center">
    <h1 class="text-3xl font-bold text-white">智能视频分发代理</h1>
    <p class="text-gray-400 mt-2">AI-Powered Video Distribution Agent</p>
  </div>

  <div id="upload-state">
    <div id="drop-zone" class="border-4 border-dashed border-gray-600 hover:border-indigo-500 transition-colors rounded-xl p-12 text-center cursor-pointer">
      <div class="flex flex-col items-center pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
        <p class="mt-4 text-lg">拖拽视频文件到这里，或 <span class="font-semibold text-indigo-400">点击选择</span></p>
        <p class="text-sm text-gray-500 mt-1">支持 MP4, MOV 等格式</p>
        <input type="file" class="hidden" id="video-upload-input" accept="video/*">
      </div>
    </div>
  </div>

  <div id="results-state" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="space-y-4">
        <h2 class="text-xl font-semibold">视频预览</h2>
        <video id="video-preview" class="w-full rounded-lg" controls></video>
        <div id="video-info" class="text-sm text-gray-400"></div>
      </div>
      <div class="space-y-4">
        <div id="recommendation-header" class="flex justify-between items-center">
          <h2 class="text-xl font-semibold">AI 平台推荐</h2>
          <div class="flex items-center space-x-2 text-sm text-indigo-400">
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            <span>分析中...</span>
          </div>
        </div>
        <div id="recommendations-list" class="space-y-3"></div>
      </div>
    </div>
    <div class="pt-6 text-center">
      <button id="reset-button" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-lg transition-colors">上传另一个视频</button>
    </div>
  </div>
</div>

<script>
  const uploadState = document.getElementById('upload-state');
  const resultsState = document.getElementById('results-state');
  const uploadInput = document.getElementById('video-upload-input');
  const dropZone = document.getElementById('drop-zone');
  const videoPreview = document.getElementById('video-preview');
  const videoInfo = document.getElementById('video-info');
  const recommendationHeader = document.getElementById('recommendation-header');
  const recommendationsList = document.getElementById('recommendations-list');
  const resetButton = document.getElementById('reset-button');

  const platformIcons = {
    "B站": "https://www.bilibili.com/favicon.ico",
    "YouTube": "https://www.youtube.com/s/desktop/1109159d/img/favicon_32x32.png",
    "小红书": "https://www.xiaohongshu.com/favicon.ico",
    "抖音": "https://www.douyin.com/favicon.ico"
  };

  dropZone.addEventListener('click', () => uploadInput.click());
  uploadInput.addEventListener('change', (e) => handleFileUpload(e.target.files[0]));

  // 拖拽事件
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('border-indigo-500');
  });
  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.classList.remove('border-indigo-500');
  });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('border-indigo-500');
    const file = e.dataTransfer.files[0];
    handleFileUpload(file);
  });

  resetButton.addEventListener('click', () => {
    uploadState.classList.remove('hidden');
    resultsState.classList.add('hidden');
    uploadInput.value = ''; // 重置文件输入
  });

  async function handleFileUpload(file) {
    if (!file) return;

    uploadState.classList.add('hidden');
    resultsState.classList.remove('hidden');
    recommendationHeader.innerHTML = `<h2 class="text-xl font-semibold">AI 平台推荐</h2><div class="flex items-center space-x-2 text-sm text-indigo-400"><svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg><span>分析中...</span></div>`;
    recommendationsList.innerHTML = '';

    videoPreview.src = URL.createObjectURL(file);
    videoInfo.textContent = `文件名: ${file.name}`;

    const formData = new FormData();
    formData.append('video', file);

    try {
      const response = await fetch('http://127.0.0.1:8000/api/analyze', {
        method: 'POST',
        body: formData,
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();
      populateRecommendations(data);

    } catch (error) {
      console.error('分析请求失败:', error);
      recommendationHeader.innerHTML = `<h2 class="text-xl font-semibold text-red-400">分析失败</h2>`;
      recommendationsList.innerHTML = `<div class="bg-gray-700 p-4 rounded-lg text-red-300">请检查后端服务是否已启动，或查看后端控制台日志。</div>`;
    }
  }

  function populateRecommendations(data) {
    recommendationHeader.innerHTML = `<h2 class="text-xl font-semibold">AI 平台推荐</h2><span class="text-sm text-green-400">分析完成！</span>`;

    if (data.recommendations && data.recommendations.length > 0) {
      data.recommendations.forEach(rec => {
        const icon = platformIcons[rec.platform] || 'https://via.placeholder.com/24';
        const suitabilityStars = '⭐'.repeat(rec.suitability) + '☆'.repeat(5 - rec.suitability);

        const cardHTML = `
                        <div class="bg-gray-700 p-4 rounded-lg animate-fade-in">
                           <div class="flex items-center space-x-4">
                                <img src="${icon}" class="h-6 w-6 rounded-sm">
                                <div class="flex-1">
                                    <div class="flex justify-between items-center">
                                        <h3 class="font-bold text-white">${rec.platform}</h3>
                                        <div class="text-sm text-yellow-400">${suitabilityStars}</div>
                                    </div>
                                    <p class="text-xs text-gray-300 mt-1">${rec.reason}</p>
                                </div>
                           </div>
                        </div>`;
        recommendationsList.innerHTML += cardHTML;
      });
    } else {
      recommendationsList.innerHTML = `<div class="bg-gray-700 p-4 rounded-lg">AI模型未返回有效推荐。</div>`;
    }
  }
</script>
</body>
</html>
