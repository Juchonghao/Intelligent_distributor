<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能视频分发代理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
  </style>
  <script>
    tailwind.config = { darkMode: 'class' }
    document.documentElement.classList.add('dark')
  </script>
</head>
<body class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen font-sans">

<div class="w-full max-w-4xl bg-gray-800 shadow-2xl rounded-2xl p-8 space-y-6">

  <!-- [重要] 標題和登入按鈕區塊 -->
  <div class="flex justify-between items-center">
    <div class="text-left">
      <h1 class="text-3xl font-bold text-white">智能视频分发代理</h1>
      <p class="text-gray-400 mt-2">AI-Powered Video Distribution Agent</p>
    </div>
    <div class="text-right">
      <button id="login-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
        登入小红书
      </button>
      <p id="login-status" class="text-xs text-gray-500 mt-1 h-4"></p>
    </div>
  </div>

  <!-- 狀態 1: 上傳區 -->
  <div id="upload-state">
    <div id="drop-zone" class="border-4 border-dashed border-gray-600 hover:border-indigo-500 transition-colors rounded-xl p-12 text-center cursor-pointer">
      <div class="flex flex-col items-center pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
        <p class="mt-4 text-lg">拖拽视频文件到这里，或 <span class="font-semibold text-indigo-400">点击选择</span></p>
        <p class="text-sm text-gray-500 mt-1">支持 MP4, MOV 等格式</p>
        <input type="file" class="hidden" id="video-upload-input" accept="video/*">
      </div>
    </div>
  </div>

  <!-- 狀態 2: 結果與操作區 -->
  <div id="results-state" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="space-y-4">
        <h2 class="text-xl font-semibold">视频预览</h2>
        <video id="video-preview" class="w-full rounded-lg" controls></video>
        <div id="video-info" class="text-sm text-gray-400"></div>
      </div>
      <div class="space-y-4">
        <div id="recommendation-header" class="flex justify-between items-center">
          <h2 class="text-xl font-semibold">AI 平台推荐</h2>
        </div>
        <div id="analysis-summary" class="hidden bg-gray-900/50 p-4 rounded-lg space-y-2 animate-fade-in">
          <h3 class="font-semibold text-white">AI 生成内容</h3>
          <div><label class="text-xs font-medium text-gray-400">标题</label><p id="generated-title" class="text-sm text-gray-200"></p></div>
          <div><label class="text-xs font-medium text-gray-400">描述</label><p id="generated-description" class="text-sm text-gray-200 whitespace-pre-wrap"></p></div>
          <div><label class="text-xs font-medium text-gray-400">标签</label><div id="generated-tags" class="flex flex-wrap gap-2 mt-1"></div></div>
        </div>
        <div id="recommendations-list" class="space-y-3"></div>
      </div>
    </div>
    <div class="pt-6 text-center">
      <button id="reset-button" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-lg transition-colors">上传另一个视频</button>
    </div>
  </div>
</div>

<script>
  // 獲取所有需要的 DOM 元素
  const loginButton = document.getElementById('login-button');
  const loginStatus = document.getElementById('login-status');
  const uploadState = document.getElementById('upload-state');
  const resultsState = document.getElementById('results-state');
  const uploadInput = document.getElementById('video-upload-input');
  const dropZone = document.getElementById('drop-zone');
  const videoPreview = document.getElementById('video-preview');
  const videoInfo = document.getElementById('video-info');
  const recommendationHeader = document.getElementById('recommendation-header');
  const recommendationsList = document.getElementById('recommendations-list');
  const resetButton = document.getElementById('reset-button');
  const analysisSummary = document.getElementById('analysis-summary');
  const generatedTitle = document.getElementById('generated-title');
  const generatedDescription = document.getElementById('generated-description');
  const generatedTags = document.getElementById('generated-tags');

  // 全局變數
  let currentFile = null;
  let currentTitle = '';
  let currentDescription = '';
  let currentTags = [];

  const platformIcons = { "B站": "https://www.bilibili.com/favicon.ico", "YouTube": "https://www.youtube.com/s/desktop/1109159d/img/favicon_32x32.png", "小红书": "https://www.xiaohongshu.com/favicon.ico", "抖音": "https://www.douyin.com/favicon.ico" };

  // --- 事件監聽 ---
  loginButton.addEventListener('click', handleLogin);
  dropZone.addEventListener('click', () => uploadInput.click());
  uploadInput.addEventListener('change', (e) => handleFileUpload(e.target.files[0]));
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500'); });
  dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('border-indigo-500'); });
  dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('border-indigo-500'); const file = e.dataTransfer.files[0]; handleFileUpload(file); });
  resetButton.addEventListener('click', () => { uploadState.classList.remove('hidden'); resultsState.classList.add('hidden'); uploadInput.value = ''; currentFile = null; });

  // --- 登入功能 ---
  async function handleLogin() {
    loginStatus.textContent = '登录中...';
    loginStatus.className = 'text-xs text-yellow-400 mt-1 h-4';
    loginButton.disabled = true;

    const formData = new FormData();
    formData.append('platform', '小红书');

    try {
      const response = await fetch('http://127.0.0.1:8000/api/login', {
        method: 'POST',
        body: formData,
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.detail || '登入請求失敗');
      }

      loginStatus.textContent = '登入成功！';
      loginStatus.className = 'text-xs text-green-400 mt-1 h-4';
      loginButton.classList.remove('bg-red-600', 'hover:bg-red-700');
      loginButton.classList.add('bg-green-600');
      loginButton.textContent = '已登入小红书';

    } catch (error) {
      console.error('登入失败:', error);
      loginStatus.textContent = `登入失败: ${error.message}`;
      loginStatus.className = 'text-xs text-red-400 mt-1 h-4';
      loginButton.disabled = false;
    }
  }


  // --- 核心功能函數 ---
  async function handleFileUpload(file) {
    if (!file) return;
    currentFile = file;
    uploadState.classList.add('hidden');
    resultsState.classList.remove('hidden');
    analysisSummary.classList.add('hidden');
    recommendationHeader.innerHTML = `<h2 class="text-xl font-semibold">AI 平台推荐</h2><div class="flex items-center space-x-2 text-sm text-indigo-400"><svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg><span>分析中...</span></div>`;
    recommendationsList.innerHTML = '';
    videoPreview.src = URL.createObjectURL(file);
    videoInfo.textContent = `文件名: ${file.name}`;
    const formData = new FormData();
    formData.append('video', file);
    try {
      const response = await fetch('http://127.0.0.1:8000/api/analyze', { method: 'POST', body: formData });
      if (!response.ok) { throw new Error(`HTTP error! status: ${response.status}`); }
      const data = await response.json();
      populateRecommendations(data);
    } catch (error) {
      console.error('分析请求失败:', error);
      recommendationHeader.innerHTML = `<h2 class="text-xl font-semibold text-red-400">分析失败</h2>`;
      recommendationsList.innerHTML = `<div class="bg-gray-700 p-4 rounded-lg text-red-300">请检查后端服务是否已启动，或查看后端控制台日志。</div>`;
    }
  }

  function populateRecommendations(data) {
    recommendationHeader.innerHTML = `<h2 class="text-xl font-semibold">AI 平台推荐</h2><span class="text-sm text-green-400">分析完成！</span>`;
    currentTitle = data.title || '';
    currentDescription = data.description || '';
    currentTags = data.tags || [];
    if (currentTitle || currentDescription || currentTags.length > 0) {
      generatedTitle.textContent = currentTitle;
      generatedDescription.textContent = currentDescription;
      generatedTags.innerHTML = '';
      currentTags.forEach(tag => {
        const tagEl = document.createElement('span');
        tagEl.className = 'bg-gray-700 text-xs font-medium text-indigo-300 px-2.5 py-1 rounded-full';
        tagEl.textContent = tag;
        generatedTags.appendChild(tagEl);
      });
      analysisSummary.classList.remove('hidden');
    }
    if (data.recommendations && data.recommendations.length > 0) {
      recommendationsList.innerHTML = '';
      data.recommendations.forEach(rec => {
        const icon = platformIcons[rec.platform] || 'https://via.placeholder.com/24';
        const suitabilityStars = '⭐'.repeat(rec.suitability) + '☆'.repeat(5 - rec.suitability);
        const cardHTML = `<div class="bg-gray-700 p-4 rounded-lg animate-fade-in space-y-3"><div class="flex items-start space-x-4"><img src="${icon}" class="h-6 w-6 rounded-sm mt-1"><div class="flex-1"><div class="flex justify-between items-center"><h3 class="font-bold text-white">${rec.platform}</h3><div class="text-sm text-yellow-400">${suitabilityStars}</div></div><p class="text-xs text-gray-300 mt-1">${rec.reason}</p></div></div><div class="text-right"><button class="upload-btn text-xs font-semibold text-white px-4 py-1.5 rounded-md transition-colors bg-indigo-600 hover:bg-indigo-700" data-platform="${rec.platform}">上传至 ${rec.platform}</button><span class="upload-status text-xs ml-2"></span></div></div>`;
        recommendationsList.innerHTML += cardHTML;
      });
      document.querySelectorAll('.upload-btn').forEach(button => button.addEventListener('click', handlePlatformUpload));
    } else {
      recommendationsList.innerHTML = `<div class="bg-gray-700 p-4 rounded-lg">AI模型未返回有效推荐。</div>`;
    }
  }

  async function handlePlatformUpload(event) {
    const button = event.target;
    const platform = button.dataset.platform;
    const statusEl = button.nextElementSibling;
    if (!currentFile || !platform) {
      statusEl.textContent = '错误: 缺少文件或平台信息';
      statusEl.className = 'upload-status text-xs ml-2 text-red-400';
      return;
    }
    button.disabled = true;
    button.innerHTML = `<svg class="animate-spin h-4 w-4 inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>上传中...`;
    statusEl.textContent = '';
    const formData = new FormData();
    formData.append('video', currentFile);
    formData.append('platform', platform);
    formData.append('title', currentTitle);
    formData.append('description', currentDescription);
    formData.append('tags_json', JSON.stringify(currentTags));
    try {
      const response = await fetch('http://127.0.0.1:8000/api/upload', { method: 'POST', body: formData });
      const result = await response.json();
      if (!response.ok) { throw new Error(result.detail || `HTTP error! status: ${response.status}`); }
      button.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
      button.classList.add('bg-green-600');
      button.innerHTML = '上传成功';
      statusEl.textContent = '✓';
      statusEl.className = 'upload-status text-xs ml-2 text-green-400';
    } catch(error) {
      console.error(`上传至 ${platform} 失败:`, error);
      button.disabled = false;
      button.classList.remove('bg-indigo-600');
      button.classList.add('bg-red-600');
      button.innerHTML = `重试上传`;
      statusEl.textContent = `失败: ${error.message}`;
      statusEl.className = 'upload-status text-xs ml-2 text-red-400';
    }
  }
</script>
</body>
</html>
