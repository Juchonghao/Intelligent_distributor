[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"
root = ".."

[project]
name = "video_thumbnail_mcp"
dynamic = ["version"]
dependencies = ["nvidia-nat[langchain]>=1.2"]
requires-python = ">=3.11,<3.13"
description = "Simple Video Thumbnail Generation NeMo Agent toolkit example"
classifiers = ["Programming Language :: Python"]

[tool.uv.sources]
nvidia-nat = { path = "..", editable = true }

[project.entry-points.'nat.components']
nat_simple_calculator = "video_thumbnail_mcp.register"
